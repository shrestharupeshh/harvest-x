name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check perception tools tests
      - name: Unit and integration tests
        run: pytest -q
      - name: Trade study is up to date
        run: |
          python tools/utilities/trade_study.py docs/architecture/trade_study.yaml -o /tmp/ts.md
          diff -u docs/architecture/trade_study_results.md /tmp/ts.md
