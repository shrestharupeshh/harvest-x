name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check perception mechanical harvesting cad tools tests
      - name: Unit and integration tests
        run: pytest -q
      - name: Trade study is up to date
        run: |
          python tools/utilities/trade_study.py docs/architecture/trade_study.yaml -o /tmp/ts.md
          diff -u docs/architecture/trade_study_results.md /tmp/ts.md
          for n in kinematics_trade end_effector_trade; do
            python tools/utilities/trade_study.py docs/mechanical/$n.yaml -o /tmp/$n.md
            diff -u docs/mechanical/${n}_results.md /tmp/$n.md
          done

  cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with CAD kernel
        run: pip install -e ".[dev,cad]"
      - name: CAD geometry and interference tests
        run: pytest -q tests/unit/test_cad.py
      - name: Regenerate CAD exports
        run: python cad/scripts/build_cad.py /tmp/cad_out
