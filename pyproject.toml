[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harvest-x"
version = "0.2.0"
description = "HARVEST-X: open research platform for autonomous lettuce harvesting in controlled-environment agriculture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "opencv-python-headless>=4.8",
  "scikit-learn>=1.3",
  "scikit-image>=0.21",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
cad = ["cadquery>=2.4"]

[tool.setuptools.packages.find]
where = ["perception", "mechanical", "harvesting"]
include = ["harvestx_perception*", "harvestx_mech*", "harvestx_harvest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["perception", "mechanical", "harvesting", "cad/scripts", "tools/utilities"]
markers = ["slow: end-to-end tests that take more than a few seconds"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E731", "E741", "B905"]  # E501: long f-strings in report writers

[tool.ruff.lint.isort]
known-first-party = ["harvestx_perception", "harvestx_mech", "harvestx_harvest", "harvestx_cad", "trade_study"]
